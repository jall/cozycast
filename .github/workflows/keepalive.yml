name: Keepalive

# Supabase pauses Free plan projects that show too little *user database
# activity* over a 7-day window, and a paused project is only restorable for
# 90 days before a downloadable backup is all that's left. This job makes a
# few real queries every day so the project never gets that quiet.
#
# Configure with the SUPABASE_URL repo variable and the SUPABASE_ANON_KEY
# repo secret (Settings -> Secrets and variables -> Actions). The anon key is
# the publishable one already inlined in the web bundle — a keepalive needs no
# privileges, so never give this the service-role key.
#
# The ping must genuinely reach Postgres. /rest/v1/ and /auth/v1/health answer
# without touching the database and don't count as activity — which is why
# this calls public.keepalive() (see supabase/migrations/), a function that
# reads no data and just returns now(). cozycast grants anon nothing on any
# table by design, so an RPC is the way in that doesn't widen the sharing
# model.

on:
  schedule:
    # Daily, deliberately not on the hour — GitHub delays or drops runs
    # clustered at :00 under load, and the pause window is only 7 days wide.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Query the database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call public.keepalive()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Set the SUPABASE_URL repo variable and the SUPABASE_ANON_KEY repo secret."
            exit 1
          fi

          # "Typically a few user requests to the database each day" is the
          # documented bar, so send three — which doubles as cover for a
          # transient blip.
          ok=0
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/keepalive-body -w '%{http_code}' --max-time 30 \
              -X POST \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' -d '{}' \
              "$SUPABASE_URL/rest/v1/rpc/keepalive" 2>/tmp/keepalive-err) || status=""
            case "$status" in
              2??)
                ok=$((ok + 1))
                echo "[$attempt/3] HTTP $status"
                ;;
              *)
                echo "[$attempt/3] HTTP ${status:-no response}" \
                     "— $(head -c 200 /tmp/keepalive-body 2>/dev/null || true)" \
                     "$(head -c 200 /tmp/keepalive-err 2>/dev/null || true)"
                ;;
            esac
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done

          echo "Keepalive $(date -u '+%Y-%m-%d %H:%M UTC') — $ok/3 queries answered" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ok" -eq 0 ]; then
            echo "::error::No queries answered — the project may be paused or unreachable. See the HTTP statuses above."
            exit 1
          fi
          if [ "$ok" -lt 3 ]; then
            echo "::warning::Only $ok/3 queries answered."
          fi

  heartbeat:
    name: Keep this workflow enabled
    # GitHub disables scheduled workflows in public repos after 60 days of
    # repository inactivity — exactly the dormancy this workflow exists to
    # survive. If the repo has gone quiet, commit a dated marker so the clock
    # resets. [skip ci] keeps it from kicking off CI or a Netlify build.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit a heartbeat if the repo has been quiet
        run: |
          set -euo pipefail
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age_days day(s) ago."
          if [ "$age_days" -lt 50 ]; then
            echo "Repo is active — no heartbeat needed."
            exit 0
          fi
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/last-heartbeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-heartbeat
          git commit -m 'Keepalive heartbeat [skip ci]'
          git push
