name: Keepalive

# Supabase pauses Free plan projects that show too little *user database
# activity* over a 7-day window, and a paused project is only restorable for
# 90 days before a downloadable backup is all that's left. This job makes a
# few real queries against each project every day so neither ever gets that
# quiet. It covers retreat-eats as well as cozycast — one cron to maintain
# rather than one per repo.
#
# Targets live in the SUPABASE_KEEPALIVE_TARGETS repo secret, a JSON array:
#
#   [
#     {"name": "cozycast", "url": "https://<ref>.supabase.co", "key": "<anon key>",
#      "method": "POST", "path": "/rest/v1/rpc/keepalive"},
#     {"name": "retreat-eats", "url": "https://<ref>.supabase.co", "key": "<anon key>",
#      "path": "/rest/v1/profiles?select=user_id&limit=1"}
#   ]
#
# `key` is the project's publishable (anon) key — never the service-role key;
# keeping a project warm needs no privileges at all. `path` must be something
# that genuinely reaches Postgres: an RPC, or a select against a table anon
# may read. /rest/v1/ and /auth/v1/health answer without touching the
# database, so they don't count as activity.

on:
  schedule:
    # Daily, and deliberately not on the hour — GitHub delays or drops runs
    # clustered at :00 under load, and the pause window is only 7 days wide.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query each project
        env:
          TARGETS: ${{ secrets.SUPABASE_KEEPALIVE_TARGETS }}
        run: |
          set -euo pipefail

          if [ -z "${TARGETS:-}" ]; then
            echo "::error::SUPABASE_KEEPALIVE_TARGETS is unset — see CLAUDE.md, 'Keeping the free-tier projects awake'."
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0' >/dev/null 2>&1 <<<"$TARGETS"; then
            echo "::error::SUPABASE_KEEPALIVE_TARGETS must be a non-empty JSON array."
            exit 1
          fi

          echo "### Keepalive — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"

          failed=0
          count=$(jq 'length' <<<"$TARGETS")

          for i in $(seq 0 $((count - 1))); do
            name=$(jq -r ".[$i].name // \"target-$i\"" <<<"$TARGETS")
            url=$(jq -r ".[$i].url // empty" <<<"$TARGETS")
            key=$(jq -r ".[$i].key // empty" <<<"$TARGETS")
            req_path=$(jq -r ".[$i].path // empty" <<<"$TARGETS")
            method=$(jq -r ".[$i].method // \"GET\"" <<<"$TARGETS")

            # Values pulled out of the secret aren't covered by its own log
            # masking — GitHub only masks the exact secret string.
            if [ -n "$key" ]; then echo "::add-mask::$key"; fi

            if [ -z "$url" ] || [ -z "$key" ] || [ -z "$req_path" ]; then
              echo "::error::$name: each target needs url, key and path."
              echo "- :x: \`$name\` — misconfigured" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi

            args=(-sS -o /tmp/keepalive-body -w '%{http_code}' --max-time 30
                  -X "$method"
                  -H "apikey: $key" -H "Authorization: Bearer $key")
            if [ "$method" = "POST" ]; then
              args+=(-H 'Content-Type: application/json' -d '{}')
            fi

            # "Typically a few user requests to the database each day" is the
            # documented bar, so send three — which doubles as cover for a
            # transient blip.
            ok=0
            for attempt in 1 2 3; do
              status=$(curl "${args[@]}" "$url$req_path" 2>/tmp/keepalive-err) || status=""
              case "$status" in
                2??)
                  ok=$((ok + 1))
                  echo "  $name [$attempt/3]: HTTP $status"
                  ;;
                *)
                  echo "  $name [$attempt/3]: HTTP ${status:-no response}" \
                       "— $(head -c 200 /tmp/keepalive-body 2>/dev/null || true)" \
                       "$(head -c 200 /tmp/keepalive-err 2>/dev/null || true)"
                  ;;
              esac
              if [ "$attempt" -lt 3 ]; then sleep 3; fi
            done

            if [ "$ok" -eq 3 ]; then
              echo "- :white_check_mark: \`$name\` — 3/3 queries answered" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$ok" -gt 0 ]; then
              echo "::warning::$name: only $ok/3 queries answered."
              echo "- :warning: \`$name\` — $ok/3 queries answered" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$name: no queries answered — the project may be paused or unreachable, or the path may be wrong. See the HTTP statuses above."
              echo "- :x: \`$name\` — no queries answered" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done

          exit "$failed"

  heartbeat:
    name: Keep this workflow enabled
    # GitHub disables scheduled workflows in public repos after 60 days of
    # repository inactivity — exactly the dormancy this workflow exists to
    # survive. If the repo has gone quiet, commit a dated marker so the clock
    # resets. [skip ci] keeps it from kicking off CI or a Netlify build.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit a heartbeat if the repo has been quiet
        run: |
          set -euo pipefail
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age_days day(s) ago."
          if [ "$age_days" -lt 50 ]; then
            echo "Repo is active — no heartbeat needed."
            exit 0
          fi
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/last-heartbeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-heartbeat
          git commit -m 'Keepalive heartbeat [skip ci]'
          git push
